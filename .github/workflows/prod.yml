name: Deploy to Production

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          DB_URL: ${{ secrets.DB_URL }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_ROOT_PASSWORD: ${{ secrets.DB_ROOT_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          SPRING_MAIL_HOST: ${{ secrets.SPRING_MAIL_HOST }}
          SPRING_MAIL_PORT: ${{ secrets.SPRING_MAIL_PORT }}
          SPRING_MAIL_USERNAME: ${{ secrets.SPRING_MAIL_USERNAME }}
          SPRING_MAIL_PASSWORD: ${{ secrets.SPRING_MAIL_PASSWORD }}
          FRONTEND_URL: ${{ secrets.FRONTEND_URL }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: GH_PAT,DB_URL,DB_USER,DB_PASSWORD,DB_ROOT_PASSWORD,JWT_SECRET,GOOGLE_API_KEY,SPRING_MAIL_HOST,SPRING_MAIL_PORT,SPRING_MAIL_USERNAME,SPRING_MAIL_PASSWORD,FRONTEND_URL
          script: |
            set -e

            BASE_URL="https://x-access-token:${GH_PAT}@github.com/vitornsc7"

            if [ -d ~/noctua/.git ]; then
              git -C ~/noctua pull
            else
              git clone "${BASE_URL}/noctua-environment.git" ~/noctua
            fi

            if [ -d ~/noctua/source/noctua-backend/.git ]; then
              git -C ~/noctua/source/noctua-backend pull
            else
              git clone "${BASE_URL}/noctua-backend.git" ~/noctua/source/noctua-backend
            fi

            if [ -d ~/noctua/source/noctua-frontend/.git ]; then
              git -C ~/noctua/source/noctua-frontend pull
            else
              git clone "${BASE_URL}/noctua-frontend.git" ~/noctua/source/noctua-frontend
            fi

            cd ~/noctua

            cat > .env << EOF
            DB_URL=$DB_URL
            DB_USER=$DB_USER
            DB_PASSWORD=$DB_PASSWORD
            DB_ROOT_PASSWORD=$DB_ROOT_PASSWORD
            JWT_SECRET=$JWT_SECRET
            GOOGLE_API_KEY=$GOOGLE_API_KEY
            SPRING_MAIL_HOST=$SPRING_MAIL_HOST
            SPRING_MAIL_PORT=$SPRING_MAIL_PORT
            SPRING_MAIL_USERNAME=$SPRING_MAIL_USERNAME
            SPRING_MAIL_PASSWORD=$SPRING_MAIL_PASSWORD
            FRONTEND_URL=$FRONTEND_URL
            EOF
            chmod 600 .env

            docker compose up --build -d --remove-orphans
            docker image prune -f

