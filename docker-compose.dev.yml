services:
  noctua-mysql:
    image: mysql:8.0
    container_name: noctua-mysql
    restart: unless-stopped
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-noctua}
      MYSQL_DATABASE: noctua
      MYSQL_USER: ${DB_USER:-noctua}
      MYSQL_PASSWORD: ${DB_PASSWORD:-noctua}
    volumes:
      - noctua-mysql-dev-data:/var/lib/mysql
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  noctua-backend:
    build:
      context: ./source/noctua-backend
      dockerfile: Dockerfile
      target: dev
    ports:
      - "8080:8080"
    restart: unless-stopped
    environment:
      - MYSQL_URL=${DB_URL}
      - MYSQL_USER=${DB_USER}
      - MYSQL_PASSWORD=${DB_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - SPRING_MAIL_HOST=${SPRING_MAIL_HOST}
      - SPRING_MAIL_PORT=${SPRING_MAIL_PORT}
      - SPRING_MAIL_USERNAME=${SPRING_MAIL_USERNAME}
      - SPRING_MAIL_PASSWORD=${SPRING_MAIL_PASSWORD}
      - FRONTEND_URL=${FRONTEND_URL}
    volumes:
      - ./source/noctua-backend/src:/app/src
      - maven_cache:/root/.m2
    depends_on:
      noctua-mysql:
        condition: service_healthy

volumes:
  noctua-mysql-dev-data:
  maven_cache:
